
name: Run Free Trading Research Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get agent code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run market research
        run: |
          mkdir -p reports
          python agent.py | tee reports/latest-report.json

      - name: Save downloadable report
        uses: actions/upload-artifact@v4
        with:
          name: market-research-report
          path: reports/latest-report.json
          retention-days: 7
